name: Syntertainment
description: Syntertainment was an entertainment technology startup founded in 2012 in Berkeley,
  California by game designer Will Wright (creator of SimCity and The Sims), Avi Bar-Zeev, and Anya
  Wright, emerging from the Stupid Fun Club collective. The company set out to explore the intersection
  of entertainment and reality, blending real-world data and player experiences with game-like
  interactive media. It raised roughly $5M from investors including Andreessen Horowitz (a16z),
  Mayfield, SV Angel, and former Electronic Arts CEO John Riccitiello. The venture never shipped a
  public consumer product and is no longer active; its website (syntertainment.com) is offline and it
  exposes no public developer program, documentation, or API surface. This profile was surfaced from
  an a16z portfolio list and enriched to reflect the company's real, historical status.
